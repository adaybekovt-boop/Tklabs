name: Finalize v0.21 answer routing

on:
  push:
    branches:
      - agent/v0.21-erma-intelligence-engine
    paths:
      - .github/workflows/finalize-v021-answer-routing.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21-erma-intelligence-engine
      - name: Apply route-aware no-tool response finalization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/ai/providers/nvidia-tools.ts')
          source = path.read_text()
          old = '''  if (!route.shouldPlanTools && !shouldOfferReadOnlyTools(prompt)) return { traces: [], route };
          const tools = toolsForRoute(route, input.allowCodeSandbox === true);
          if (!tools.length) return { traces: [], route };'''
          new = '''  if (!route.shouldPlanTools && !shouldOfferReadOnlyTools(prompt)) {
            const evidence: ErmaEvidence[] = [];
            const verification = verifyErmaEvidence(route, [], evidence);
            return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces: [], route, evidence, verification };
          }
          const tools = toolsForRoute(route, input.allowCodeSandbox === true);
          if (!tools.length) {
            const evidence: ErmaEvidence[] = [];
            const verification = verifyErmaEvidence(route, [], evidence);
            return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces: [], route, evidence, verification };
          }'''
          if old not in source:
              raise SystemExit('expected no-tool routing block not found')
          source = source.replace(old, new, 1)
          old2 = '  if (!toolData.length) return { traces, route, evidence, verification };'
          new2 = '  if (!toolData.length) return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces, route, evidence, verification };'
          if old2 not in source:
              raise SystemExit('expected empty-tool-data block not found')
          source = source.replace(old2, new2, 1)
          path.write_text(source)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finalize-v021-answer-routing.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/providers/nvidia-tools.ts
          git commit -m "v0.21.15: apply answer intelligence to no-tool routes"
          git push origin HEAD:agent/v0.21-erma-intelligence-engine
