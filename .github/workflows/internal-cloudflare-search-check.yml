name: Internal Cloudflare search check

on:
  push:
    branches:
      - agent/v0.24.1-grounding-reliability
    paths:
      - .github/workflows/internal-cloudflare-search-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Worker config
        run: npm run build
      - name: Check Cloudflare search provider secret names
        env:
          TKLABS_REQUIRE_WEB_SEARCH: "true"
        run: npm run cloudflare:check-secrets
