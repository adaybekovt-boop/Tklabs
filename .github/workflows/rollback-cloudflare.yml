name: Rollback Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      version_id:
        description: Known-good Cloudflare Worker version ID
        required: true
      reason:
        description: Rollback reason recorded in evidence
        required: true

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TKLABS_DEPLOY_WRITER: ${{ vars.TKLABS_DEPLOY_WRITER }}
      AUTH_URL: https://tklabs.uk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Enforce single deployment writer
        run: test "$TKLABS_DEPLOY_WRITER" = "github-actions"
      - run: npm ci
      - name: Build the Worker config used by rollback
        run: npm run build
      - name: Roll back deliberately
        run: npx wrangler rollback "${{ inputs.version_id }}" --message "${{ inputs.reason }}" --config dist/server/wrangler.json
      - name: Verify canonical readiness
        run: SMOKE_BASE_URL="$AUTH_URL" npm run smoke:production
      - name: Record rollback evidence
        shell: bash
        run: |
          printf '%s\n' "version_id=${{ inputs.version_id }}" "reason=${{ inputs.reason }}" "actor=${{ github.actor }}" "source_sha=${{ github.sha }}" > rollback-evidence.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: rollback-evidence.txt
          retention-days: 30
