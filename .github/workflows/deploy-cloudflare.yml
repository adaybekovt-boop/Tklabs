name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_URL: https://tklabs.uk
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      CLODEX_API_KEY: ${{ secrets.CLODEX_API_KEY }}
      CLODEX_ACCESS_CODE: ${{ secrets.CLODEX_ACCESS_CODE }}
      NVIDIA_API_KEY_PRIMARY: ${{ secrets.NVIDIA_API_KEY_PRIMARY }}
      NVIDIA_API_KEY_SECONDARY: ${{ secrets.NVIDIA_API_KEY_SECONDARY }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}
      CLODEX_PROMO_EMAILS: ${{ secrets.CLODEX_PROMO_EMAILS }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Vinext Worker
        run: npm run build
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$D1_DATABASE_ID"
      - name: Upload runtime secrets
        run: |
          set -euo pipefail
          for name in AUTH_SECRET AUTH_URL AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET CLODEX_API_KEY CLODEX_ACCESS_CODE CLODEX_PROMO_EMAILS NVIDIA_API_KEY_PRIMARY NVIDIA_API_KEY_SECONDARY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config dist/server/wrangler.json
            fi
          done
      - name: Apply D1 schema
        run: npx wrangler d1 execute tklabs --remote --file=drizzle/0000_nappy_gunslinger.sql --config dist/server/wrangler.json
      - name: Deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --config dist/server/wrangler.json 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\\.workers\\.dev' deploy.log | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "Cloudflare did not return a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Worker"
            echo
            echo "[Open deployed site]($url)"
          } >> "$GITHUB_STEP_SUMMARY"
