name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_URL: https://tklabs.uk
      AUTH_TRUST_HOST: "true"
      CLODEX_ENABLED: ${{ vars.CLODEX_ENABLED || 'false' }}
      CLODEX_GRANT_TTL_DAYS: ${{ vars.CLODEX_GRANT_TTL_DAYS || '30' }}
      CLODEX_GRANT_VERSION: ${{ vars.CLODEX_GRANT_VERSION || 'v2' }}
      TTS_REQUEST_LIMIT: ${{ vars.TTS_REQUEST_LIMIT || '5' }}
      TTS_DAILY_CHARACTER_QUOTA: ${{ vars.TTS_DAILY_CHARACTER_QUOTA || '10000' }}
      TTS_PRIVILEGED_REQUEST_LIMIT: ${{ vars.TTS_PRIVILEGED_REQUEST_LIMIT || '30' }}
      TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA: ${{ vars.TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA || '100000' }}
    steps:
      - name: Checkout pushed main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check required secrets
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Validate and build production Worker
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Cloudflare runtime secret names
        run: npm run cloudflare:check-secrets
      - name: Apply all D1 migrations
        run: npm run db:migrate
      - name: Deploy
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --var "AUTH_URL:$AUTH_URL" --var "AUTH_TRUST_HOST:$AUTH_TRUST_HOST" --var "CLODEX_ENABLED:$CLODEX_ENABLED" --var "CLODEX_GRANT_TTL_DAYS:$CLODEX_GRANT_TTL_DAYS" --var "CLODEX_GRANT_VERSION:$CLODEX_GRANT_VERSION" --var "TTS_REQUEST_LIMIT:$TTS_REQUEST_LIMIT" --var "TTS_DAILY_CHARACTER_QUOTA:$TTS_DAILY_CHARACTER_QUOTA" --var "TTS_PRIVILEGED_REQUEST_LIMIT:$TTS_PRIVILEGED_REQUEST_LIMIT" --var "TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA:$TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA" --config dist/server/wrangler.json 2>&1 | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | tail -n 1 || true)"
          if [ -z "$url" ]; then
            echo "Cloudflare did not return a workers.dev URL"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          {
            echo "## Cloudflare Worker"
            echo
            echo "[Open deployed site]($url)"
            echo
            echo "Deployed commit: `${{ github.sha }}`"
          } >> "$GITHUB_STEP_SUMMARY"
