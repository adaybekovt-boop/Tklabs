name: Deploy Cloudflare Worker

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
      AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID }}
      AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET }}
      CLODEX_API_KEY: ${{ secrets.CLODEX_API_KEY }}
      NVIDIA_API_KEY_PRIMARY: ${{ secrets.NVIDIA_API_KEY_PRIMARY }}
      NVIDIA_API_KEY_SECONDARY: ${{ secrets.NVIDIA_API_KEY_SECONDARY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build Vinext Worker
        run: npm run build
      - name: Check required secrets
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$AUTH_SECRET"
          test -n "$AUTH_GOOGLE_ID"
          test -n "$AUTH_GOOGLE_SECRET"
      - name: Upload runtime secrets
        run: |
          set -euo pipefail
          for name in AUTH_SECRET AUTH_GOOGLE_ID AUTH_GOOGLE_SECRET CLODEX_API_KEY NVIDIA_API_KEY_PRIMARY NVIDIA_API_KEY_SECONDARY; do
            value="${!name:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name" --config dist/server/wrangler.json
            fi
          done
      - name: Deploy
        run: npx wrangler deploy --config dist/server/wrangler.json
