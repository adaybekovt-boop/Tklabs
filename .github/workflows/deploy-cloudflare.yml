name: Deploy Cloudflare Worker

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      GOOGLE_GROUNDING_MODEL: ${{ vars.GOOGLE_GROUNDING_MODEL || 'gemini-3.5-flash-lite' }}
      GOOGLE_DIRECT_GROUNDING_MODEL: ${{ vars.GOOGLE_DIRECT_GROUNDING_MODEL || 'gemini-3.6-flash' }}
      TKLABS_DEPLOY_WRITER: github-actions
      AUTH_URL: https://tklabs.uk
      AUTH_TRUST_HOST: "true"
      CLODEX_ENABLED: ${{ vars.CLODEX_ENABLED || 'false' }}
      CLODEX_GRANT_TTL_DAYS: ${{ vars.CLODEX_GRANT_TTL_DAYS || '30' }}
      CLODEX_GRANT_VERSION: ${{ vars.CLODEX_GRANT_VERSION || 'v2' }}
      CLODEX_MODEL_FAST: ${{ vars.CLODEX_MODEL_FAST || '' }}
      CLODEX_MODEL_REASONING: ${{ vars.CLODEX_MODEL_REASONING || '' }}
      CLODEX_MODEL_PRO: ${{ vars.CLODEX_MODEL_PRO || '' }}
      TTS_REQUEST_LIMIT: ${{ vars.TTS_REQUEST_LIMIT || '5' }}
      TTS_DAILY_CHARACTER_QUOTA: ${{ vars.TTS_DAILY_CHARACTER_QUOTA || '10000' }}
      TTS_PRIVILEGED_REQUEST_LIMIT: ${{ vars.TTS_PRIVILEGED_REQUEST_LIMIT || '30' }}
      TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA: ${{ vars.TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA || '100000' }}
    steps:
      - name: Checkout pushed main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Enforce single deployment writer
        run: |
          test "$TKLABS_DEPLOY_WRITER" = "github-actions" || {
            echo "GitHub Actions must remain the canonical production deployment writer; disable Cloudflare Git Integration before deployment."
            exit 1
          }
      - name: Install dependencies
        run: npm ci
      - name: Resolve release identity
        shell: bash
        run: |
          set -euo pipefail
          release="$(node --input-type=module -e 'import fs from "node:fs"; const source=fs.readFileSync("lib/release-version.ts","utf8"); const match=source.match(/CURRENT_RELEASE_VERSION\s*=\s*"([^"]+)"/); if(!match) process.exit(1); console.log(match[1]);')"
          echo "EXPECTED_RELEASE=$release" >> "$GITHUB_ENV"
      - name: Normalize Cloudflare deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          api_token="${CLOUDFLARE_API_TOKEN//$'\r'/}"; api_token="${api_token//$'\n'/}"
          account_id="${CLOUDFLARE_ACCOUNT_ID//$'\r'/}"; account_id="${account_id//$'\n'/}"
          echo "::add-mask::$api_token"
          test -n "$api_token"; test -n "$account_id"
          echo "CLOUDFLARE_API_TOKEN=$api_token" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$account_id" >> "$GITHUB_ENV"
      - name: Validate and build production Worker
        run: npm run check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Validate Cloudflare runtime secret names
        env:
          TKLABS_REQUIRE_WEB_SEARCH: "true"
        run: npm run cloudflare:check-secrets
      - name: Apply all D1 migrations (compatible only)
        run: npm run db:migrate
      - name: Deploy
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler deploy --var "AUTH_URL:$AUTH_URL" --var "AUTH_TRUST_HOST:$AUTH_TRUST_HOST" --var "GOOGLE_GROUNDING_MODEL:$GOOGLE_GROUNDING_MODEL" --var "GOOGLE_DIRECT_GROUNDING_MODEL:$GOOGLE_DIRECT_GROUNDING_MODEL" --var "CLODEX_ENABLED:$CLODEX_ENABLED" --var "CLODEX_GRANT_TTL_DAYS:$CLODEX_GRANT_TTL_DAYS" --var "CLODEX_GRANT_VERSION:$CLODEX_GRANT_VERSION" --var "CLODEX_MODEL_FAST:$CLODEX_MODEL_FAST" --var "CLODEX_MODEL_REASONING:$CLODEX_MODEL_REASONING" --var "CLODEX_MODEL_PRO:$CLODEX_MODEL_PRO" --var "TTS_REQUEST_LIMIT:$TTS_REQUEST_LIMIT" --var "TTS_DAILY_CHARACTER_QUOTA:$TTS_DAILY_CHARACTER_QUOTA" --var "TTS_PRIVILEGED_REQUEST_LIMIT:$TTS_PRIVILEGED_REQUEST_LIMIT" --var "TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA:$TTS_PRIVILEGED_DAILY_CHARACTER_QUOTA" --config dist/server/wrangler.json 2>&1 | tee deploy.log
      - name: Verify canonical production readiness
        env:
          SMOKE_ATTEMPTS: "8"
          SMOKE_TIMEOUT_MS: "5000"
        run: SMOKE_BASE_URL="$AUTH_URL" npm run smoke:production
      - name: Record production evidence
        if: always()
        shell: bash
        run: |
          printf '%s\n' "release=$EXPECTED_RELEASE" "sha=${{ github.sha }}" "writer=$TKLABS_DEPLOY_WRITER" "run=${{ github.run_id }}" > deployment-evidence.txt
      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: production-evidence-${{ github.sha }}
          path: |
            deployment-evidence.txt
            deploy.log
          if-no-files-found: ignore
          retention-days: 30
