name: Sync v0.23.4 lockfile

on:
  push:
    branches:
      - agent/v0.23-erma-alive-vision

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.23-erma-alive-vision
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync release version and self-remove
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          lock.version = '0.23.4';
          if (!lock.packages?.['']) throw new Error('Missing root package lock entry');
          lock.packages[''].version = '0.23.4';
          fs.writeFileSync(path, JSON.stringify(lock, null, 2) + '\n');
          NODE
          git rm .github/workflows/_sync-v023-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --check
          git commit -m "chore: finalize v0.23.4 release lock"
          git push origin HEAD:agent/v0.23-erma-alive-vision