name: Canary Cloudflare Worker

on:
  workflow_dispatch:
    inputs:
      percentage:
        description: Canary traffic percentage
        required: true
        default: "10"

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TKLABS_DEPLOY_WRITER: ${{ vars.TKLABS_DEPLOY_WRITER }}
      AUTH_URL: https://tklabs.uk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Enforce single deployment writer
        run: test "$TKLABS_DEPLOY_WRITER" = "github-actions"
      - name: Validate percentage
        shell: bash
        run: |
          case "${{ inputs.percentage }}" in 5|10|20|25|50) ;; *) echo "Unsupported canary percentage"; exit 1;; esac
      - run: npm ci
      - run: npm run check
      - name: Upload immutable Worker version
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler versions upload --config dist/server/wrangler.json --json > version.json
          VERSION_ID="$(node -e 'const p=require("./version.json"); console.log(p.id||p.version_id||p.versionId||"")')"
          test -n "$VERSION_ID"
          echo "VERSION_ID=$VERSION_ID" >> "$GITHUB_ENV"
      - name: Deploy canary split
        run: npx wrangler versions deploy "$VERSION_ID@${{ inputs.percentage }}%" -y --config dist/server/wrangler.json
      - name: Verify canonical readiness
        run: SMOKE_BASE_URL="$AUTH_URL" EXPECTED_RELEASE="$(node --input-type=module -e 'import fs from "node:fs"; console.log(fs.readFileSync("lib/release-version.ts","utf8").match(/CURRENT_RELEASE_VERSION = "([^"]+)"/)[1])')" npm run smoke:production
      - name: Upload canary evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: canary-evidence-${{ github.sha }}
          path: version.json
          retention-days: 14
