name: Internal v0.24.2 package bump

on:
  push:
    branches:
      - agent/v0.24.2-google-direct-grounding
    paths:
      - .github/workflows/internal-v0242-package-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v0.24.2-google-direct-grounding
      - name: Update package versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const version = '0.24.2';
          for (const path of ['package.json', 'package-lock.json']) {
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            value.version = version;
            if (path === 'package-lock.json' && value.packages?.['']) value.packages[''].version = version;
            fs.writeFileSync(path, `${JSON.stringify(value, null, 2)}\n`);
          }
          NODE
      - name: Commit package metadata and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/internal-v0242-package-bump.yml
          git add package.json package-lock.json
          git commit -m "chore: bump package metadata to v0.24.2"
          git push origin HEAD:agent/v0.24.2-google-direct-grounding
