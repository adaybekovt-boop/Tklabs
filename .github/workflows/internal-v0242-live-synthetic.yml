name: Internal v0.24.2 live synthetic probes

on:
  push:
    branches:
      - agent/v0.24.2-google-direct-grounding
    paths:
      - .github/workflows/internal-v0242-live-synthetic.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect production provider health
        shell: bash
        run: |
          set -euo pipefail
          echo '=== /api/status ==='
          curl -fsS -D /tmp/status.headers https://tklabs.uk/api/status -o /tmp/status.json || true
          cat /tmp/status.headers || true
          cat /tmp/status.json || true
          echo
          echo '=== /api/health ==='
          curl -fsS -D /tmp/health.headers https://tklabs.uk/api/health -o /tmp/health.json || true
          cat /tmp/health.headers || true
          cat /tmp/health.json || true
          echo
