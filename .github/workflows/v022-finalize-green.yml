name: v0.22 finalize green

on:
  push:
    branches:
      - agent/v0.22-erma-one-world-rc
    paths:
      - .github/workflows/v022-finalize-green.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.22-erma-one-world-rc
          fetch-depth: 0
      - name: Update simplification regression contracts
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one occurrence, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          replace(
              "tests/backend-contract.test.mjs",
              '  assert.match(input, /position="responsive"/);',
              '  assert.match(input, /w-full max-w-\\[780px\\]/);',
          )
          replace(
              "tests/backend-contract.test.mjs",
              '  assert.match(playground, /clodexAccess\\?\\.unlimited \\|\\| localPreview/);',
              '  assert.match(playground, /access\\?\\.unlimited \\|\\| localPreview/);',
          )
          replace(
              "tests/backend-contract.test.mjs",
              '  assert.equal((playground.match(/\\{text\\.chat\\.emptyTitle\\}/g) ?? []).length, 1);',
              '  assert.equal((playground.match(/<h2 className=/g) ?? []).length, 1);\n  assert.match(playground, /Erma сама решит|Erma decides/);',
          )
          replace(
              "tests/backend-contract.test.mjs",
              'test("chat uses one response contract and keeps model selection mobile-safe", async () => {',
              'test("chat uses one response contract and keeps the One Erma composer mobile-safe", async () => {',
          )
          replace(
              "tests/backend-contract.test.mjs",
              '  assert.match(input, /aria-haspopup="listbox"/);',
              '  assert.match(input, /data-testid="prompt-input"/);\n  assert.doesNotMatch(input, /aria-haspopup="listbox"|SlidersHorizontal/);',
          )

          replace(
              "tests/ui-polish-contract.test.mjs",
              '  for (const id of ["chat", "flow", "artifacts", "runs"]) assert.match(switcher, new RegExp(`id: "${id}"`));',
              '  for (const id of ["chat", "flow", "artifacts"]) assert.match(switcher, new RegExp(`id: "${id}"`));\n  assert.doesNotMatch(switcher, /id: "runs"/);\n  assert.match(switcher, /ru: "Задачи", en: "Tasks"/);',
          )
          replace(
              "tests/ui-polish-contract.test.mjs",
              'test("mobile chat keeps drafts, offline state, and compact settings", async () => {',
              'test("mobile chat keeps drafts, offline state, and the simplified One Erma composer", async () => {',
          )
          replace(
              "tests/ui-polish-contract.test.mjs",
              '  assert.match(composer, /data-testid="mobile-prompt-input"/);\n  assert.match(composer, /SlidersHorizontal/);',
              '  assert.match(composer, /PromptInput/);\n  assert.match(input, /data-testid="prompt-input"/);\n  assert.doesNotMatch(input, /SlidersHorizontal|aria-haspopup="listbox"/);',
          )

          replace(
              "tests/v0-16-6-workspace-vault.test.mjs",
              '  const drawer = await read("components/playground/MobileChatDrawer.tsx");\n',
              '',
          )
          replace(
              "tests/v0-16-6-workspace-vault.test.mjs",
              '  assert.match(drawer, /href="\\/vault"/);\n',
              '',
          )

          old_wait_playground = '''async function waitForClientShell(page) {\n  await expect(page.locator("[data-locale-toggle]").first()).toHaveAttribute(\n    "data-locale-ready",\n    "true",\n    { timeout: 15_000 },\n  );'''
          new_wait_playground = '''async function waitForClientShell(page) {\n  await expect(\n    page.locator('[data-app-dock], [data-mobile-workspace-switcher], [data-testid="prompt-input"]').first(),\n  ).toBeAttached({ timeout: 15_000 });'''
          replace("e2e/playground.spec.mjs", old_wait_playground, new_wait_playground)
          replace(
              "e2e/playground.spec.mjs",
              '  await expect(page.getByTestId("mobile-prompt-input")).toBeVisible();',
              '  await expect(page.getByTestId("prompt-input")).toBeVisible();',
          )

          replace(
              "e2e/intelligence.spec.mjs",
              '  await expect(page.locator("[data-locale-toggle]").first()).toHaveAttribute("data-locale-ready", "true", { timeout: 15_000 });',
              '  await expect(page.locator(\'[data-app-dock], [data-mobile-workspace-switcher], [data-testid="prompt-input"]\').first()).toBeAttached({ timeout: 15_000 });',
          )

          # The old locale hydration marker is intentionally no longer part of the
          # workspace UI. Keep Browser Assurance tied to real client-owned surfaces.
          for path in ["e2e/playground.spec.mjs", "e2e/intelligence.spec.mjs"]:
              if "data-locale-toggle" in Path(path).read_text():
                  raise SystemExit(f"{path}: stale data-locale-toggle readiness dependency remains")

          Path(".github/workflows/v022-finalize-green.yml").unlink()
          PY
      - name: Commit final CI contract fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/backend-contract.test.mjs tests/ui-polish-contract.test.mjs tests/v0-16-6-workspace-vault.test.mjs e2e/playground.spec.mjs e2e/intelligence.spec.mjs .github/workflows/v022-finalize-green.yml
          git commit -m "test: align assurance with One Erma UI"
          git push origin HEAD:agent/v0.22-erma-one-world-rc
