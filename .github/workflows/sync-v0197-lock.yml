name: One-shot v0.19.7 lock sync

on:
  push:
    branches:
      - agent/v0.19-workspace-evolution

permissions:
  contents: write

jobs:
  sync-lock-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v0.19-workspace-evolution
      - name: Synchronize package-lock release identity
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('package.json', 'utf8')).version;
          const lock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          lock.version = version;
          if (!lock.packages?.['']) throw new Error('package-lock root package is missing');
          lock.packages[''].version = version;
          writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Commit synchronized lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "v0.19.7: synchronize package lock release identity"
          git push origin HEAD:agent/v0.19-workspace-evolution
