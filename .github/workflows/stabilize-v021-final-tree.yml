name: Stabilize v0.21 final tree

on:
  push:
    branches:
      - agent/v0.21-erma-intelligence-engine
    paths:
      - .github/workflows/stabilize-v021-final-tree.yml

permissions:
  contents: write

concurrency:
  group: v021-final-tree-stabilizer
  cancel-in-progress: false

jobs:
  stabilize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21-erma-intelligence-engine
          fetch-depth: 0
      - name: Let earlier one-shot writers settle and reset to latest branch
        run: |
          sleep 75
          git fetch origin agent/v0.21-erma-intelligence-engine
          git reset --hard origin/agent/v0.21-erma-intelligence-engine
      - name: Apply final boundaries idempotently
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_if_present(path, old, new):
              p = Path(path)
              if not p.exists():
                  raise SystemExit(f'missing required file: {path}')
              s = p.read_text()
              if new in s:
                  return
              if old not in s:
                  raise SystemExit(f'expected old/new block missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Legacy current-release helper.
          p = Path('lib/releases/current.ts')
          s = p.read_text()
          s = s.replace('v0.20.10', 'v0.21.15').replace('Mobile Fixed Layers', 'Erma Intelligence Engine')
          p.write_text(s)

          # Route only on the validated raw user prompt, never attachment/providerPrompt text.
          replace_if_present('app/api/demo/request-context.ts', 'type: ChatRequest; requestId: string; language: Language; model: ErmaModel;', 'type: ChatRequest; prompt: string; requestId: string; language: Language; model: ErmaModel;')
          replace_if_present('app/api/demo/request-context.ts', 'body: normalizedBody, requestId, language, model,', 'body: normalizedBody, prompt: validatedPrompt.prompt, requestId, language, model,')
          replace_if_present('lib/ai/tools/route-tools.ts', 'request: Request; requestId: string; context: PreparedChatContext;', 'request: Request; requestId: string; prompt: string; context: PreparedChatContext;')
          replace_if_present('lib/ai/tools/route-tools.ts', 'runNvidiaToolLoop({ messages: input.context.messages, summary: input.context.summary,', 'runNvidiaToolLoop({ prompt: input.prompt, messages: input.context.messages, summary: input.context.summary,')
          replace_if_present('lib/ai/providers/nvidia-tools.ts', 'export type NvidiaToolLoopInput = { messages: ChatContextMessage[];', 'export type NvidiaToolLoopInput = { prompt: string; messages: ChatContextMessage[];')

          p = Path('lib/ai/providers/nvidia-tools.ts')
          s = p.read_text()
          s = s.replace('function latestUserPrompt(messages: ChatContextMessage[]) { return [...messages].reverse().find((message) => message.role === "user")?.content ?? ""; }\n', '')
          s = s.replace('  const prompt = latestUserPrompt(input.messages);', '  const prompt = input.prompt;')
          p.write_text(s)

          for path in ['app/api/demo/json-responder.ts', 'app/api/demo/stream-session.ts']:
              p = Path(path); s = p.read_text()
              if 'body, prompt, requestId' not in s:
                  if 'body, requestId' not in s: raise SystemExit(f'destructure block missing in {path}')
                  s = s.replace('body, requestId', 'body, prompt, requestId', 1)
              if 'request, requestId, prompt, context' not in s:
                  if 'request, requestId, context' not in s: raise SystemExit(f'augmentation block missing in {path}')
                  s = s.replace('request, requestId, context', 'request, requestId, prompt, context', 1)
              p.write_text(s)

          # No-tool paths still receive trusted route/verifier/answer control.
          p = Path('lib/ai/providers/nvidia-tools.ts'); s = p.read_text()
          patches = [
            ('  if (!route.shouldPlanTools && !shouldOfferReadOnlyTools(prompt)) return { traces: [], route };', '  if (!route.shouldPlanTools && !shouldOfferReadOnlyTools(prompt)) { const evidence: ErmaEvidence[] = []; const verification = verifyErmaEvidence(route, [], evidence); return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces: [], route, evidence, verification }; }'),
            ('  if (!tools.length) return { traces: [], route };', '  if (!tools.length) { const evidence: ErmaEvidence[] = []; const verification = verifyErmaEvidence(route, [], evidence); return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces: [], route, evidence, verification }; }'),
            ('  if (!toolData.length) return { traces, route, evidence, verification };', '  if (!toolData.length) return { controlBlock: controlFor(route, verification, input.language), untrustedContextBlock: dynamicContext || undefined, traces, route, evidence, verification };'),
          ]
          for old, new in patches:
              if new not in s:
                  if old not in s: raise SystemExit(f'no-tool answer block missing: {old}')
                  s = s.replace(old, new, 1)
          p.write_text(s)

          # Normalize WHATWG bracketed IPv6 before literal-private checks.
          p = Path('lib/ai/web/gateway.ts'); s = p.read_text()
          old = 'const lowered = hostname.toLowerCase();'
          new = 'const lowered = hostname.toLowerCase().replace(/^\\[/, "").replace(/\\]$/, "");'
          if new not in s:
              if old not in s: raise SystemExit('web hostname normalization line missing')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove every temporary v0.21 writer
        run: |
          git rm -f --ignore-unmatch \
            .github/workflows/sync-v021-lock.yml \
            .github/workflows/sync-v021-current-release.yml \
            .github/workflows/finalize-v021-answer-routing.yml \
            .github/workflows/finalize-v021-user-prompt-boundary.yml \
            .github/workflows/finalize-v021-no-tool-answer-control.yml \
            .github/workflows/finalize-v021-ipv6-guard.yml \
            .github/workflows/stabilize-v021-final-tree.yml
      - name: Commit one stable final tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "No finalization changes required"
            exit 0
          fi
          git add -A
          git commit -m "v0.21.15: stabilize final Intelligence Engine tree"
          git push origin HEAD:agent/v0.21-erma-intelligence-engine
