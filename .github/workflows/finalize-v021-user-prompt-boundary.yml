name: Finalize v0.21 user prompt boundary

on:
  push:
    branches:
      - agent/v0.21-erma-intelligence-engine
    paths:
      - .github/workflows/finalize-v021-user-prompt-boundary.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21-erma-intelligence-engine
      - name: Route only on validated user prompt
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'expected block not found in {path}: {old[:80]!r}')
              p.write_text(s.replace(old, new, 1))

          replace(
              'app/api/demo/request-context.ts',
              'type: ChatRequest; requestId: string; language: Language; model: ErmaModel;',
              'type: ChatRequest; prompt: string; requestId: string; language: Language; model: ErmaModel;'
          )
          replace(
              'app/api/demo/request-context.ts',
              'body: normalizedBody, requestId, language, model,',
              'body: normalizedBody, prompt: validatedPrompt.prompt, requestId, language, model,'
          )

          replace(
              'lib/ai/tools/route-tools.ts',
              'request: Request; requestId: string; context: PreparedChatContext;',
              'request: Request; requestId: string; prompt: string; context: PreparedChatContext;'
          )
          replace(
              'lib/ai/tools/route-tools.ts',
              'runNvidiaToolLoop({ messages: input.context.messages, summary: input.context.summary,',
              'runNvidiaToolLoop({ prompt: input.prompt, messages: input.context.messages, summary: input.context.summary,'
          )

          replace(
              'lib/ai/providers/nvidia-tools.ts',
              'export type NvidiaToolLoopInput = { messages: ChatContextMessage[];',
              'export type NvidiaToolLoopInput = { prompt: string; messages: ChatContextMessage[];'
          )
          replace(
              'lib/ai/providers/nvidia-tools.ts',
              'function latestUserPrompt(messages: ChatContextMessage[]) { return [...messages].reverse().find((message) => message.role === "user")?.content ?? ""; }\n',
              ''
          )
          replace(
              'lib/ai/providers/nvidia-tools.ts',
              '  const prompt = latestUserPrompt(input.messages);',
              '  const prompt = input.prompt;'
          )

          for path in ['app/api/demo/json-responder.ts', 'app/api/demo/stream-session.ts']:
              p = Path(path)
              s = p.read_text()
              if path.endswith('json-responder.ts'):
                  old = 'body, requestId, language, model, requestedReasoning'
                  new = 'body, prompt, requestId, language, model, requestedReasoning'
              else:
                  old = 'body, requestId, language, model, requestedReasoning'
                  new = 'body, prompt, requestId, language, model, requestedReasoning'
              if old not in s:
                  raise SystemExit(f'destructure block not found in {path}')
              s = s.replace(old, new, 1)
              old2 = 'request, requestId, context, language, model, localArchive: body.localArchive'
              new2 = 'request, requestId, prompt, context, language, model, localArchive: body.localArchive'
              if old2 not in s:
                  raise SystemExit(f'tool augmentation call not found in {path}')
              p.write_text(s.replace(old2, new2, 1))
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finalize-v021-user-prompt-boundary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/api/demo/request-context.ts app/api/demo/json-responder.ts app/api/demo/stream-session.ts lib/ai/tools/route-tools.ts lib/ai/providers/nvidia-tools.ts
          git commit -m "v0.21.15: isolate cognitive routing from attachment content"
          git push origin HEAD:agent/v0.21-erma-intelligence-engine
