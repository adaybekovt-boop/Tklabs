name: Validate

on:
  push:
    branches:
      - main
      - "agent/**"
      - "fix/**"
      - "feat/**"
      - "feature/**"
      - "codex/**"
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Scan tracked files for committed secrets
        run: npm run security:secrets
      - name: Generate CycloneDX SBOM
        run: npm run security:sbom
      - name: Upload supply-chain evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: supply-chain-evidence-${{ github.sha }}
          path: sbom.cdx.json
          if-no-files-found: error
          retention-days: 5
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - name: Integration tests
        shell: bash
        run: |
          set -o pipefail
          npm run test:integration 2>&1 | tee integration-test.log
      - name: Upload integration diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          path: integration-test.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Production build
        run: npm run build
      - name: Performance budget
        run: npm run perf:budget
      - name: Cloudflare Worker dry-run
        run: npx wrangler deploy --dry-run --config dist/server/wrangler.json
      - name: Upload validated Worker build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: worker-build-${{ github.sha }}
          path: dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
