name: Internal v0.24.1 version sync

on:
  push:
    branches:
      - agent/v0.24.1-grounding-reliability
    paths:
      - .github/workflows/internal-v0241-version-sync.yml

permissions:
  contents: write

jobs:
  sync-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/v0.24.1-grounding-reliability
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - name: Sync package lock version
        run: npm version 0.24.1 --no-git-tag-version --allow-same-version
      - name: Commit synchronized lockfile
        run: |
          git config user.name "TK LAB Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: sync v0.24.1 lockfile"
          git push origin HEAD:agent/v0.24.1-grounding-reliability
