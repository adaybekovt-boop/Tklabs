name: Internal v0.24.2 legal grounding disclosure

on:
  push:
    branches:
      - agent/v0.24.2-google-direct-grounding
    paths:
      - .github/workflows/internal-v0242-legal-grounding.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v0.24.2-google-direct-grounding
      - name: Update legal disclosure and digest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'lib/legal-documents.ts';
          let legal = fs.readFileSync(path, 'utf8');
          const replacements = [
            ['CURRENT_LEGAL_BUNDLE_VERSION = "2026-08-08"', 'CURRENT_LEGAL_BUNDLE_VERSION = "2026-08-09"'],
            ['"Prompt, выбранные вложения и необходимый контекст передаются выбранному модельному провайдеру только для выполнения запрошенной функции. Не следует отправлять пароли, ключи, платёжные данные или чужие секреты без законного основания."', '"Prompt, выбранные вложения и необходимый контекст передаются выбранному модельному провайдеру только для выполнения запрошенной функции. Для подходящих factual/current/research запросов минимизированная текущая реплика может передаваться Google Grounding with Google Search для выполнения поиска и формирования grounded-ответа. Не следует отправлять пароли, ключи, платёжные данные или чужие секреты без законного основания."'],
            ['"Записи принятия юридических документов могут сохраняться дольше для доказательства согласия и разрешения споров. Сроки внешнего model provider регулируются его политикой и договорными настройками."', '"Записи принятия юридических документов могут сохраняться дольше для доказательства согласия и разрешения споров. Для Grounding with Google Search Google указывает хранение prompts, contextual information и generated output в течение 30 дней для grounded results и Search Suggestions; отключить это хранение для данной функции нельзя. Для других внешних провайдеров сроки регулируются их политикой и договорными настройками."'],
            ['{ title: "Google / Auth.js", paragraphs: ["Google OAuth используется как identity provider для поддерживаемого входа. Auth.js управляет прикладной сессией TK LAB."] }', '{ title: "Google / Auth.js / Search grounding", paragraphs: ["Google OAuth используется как identity provider для поддерживаемого входа, а Auth.js управляет прикладной сессией TK LAB. Для подходящих factual/current/research запросов Gemini API Grounding with Google Search может получать минимизированную текущую реплику, выполнять Google Search и возвращать grounded-ответ, citations и Search Suggestions. По действующим условиям Google данные этой grounding-функции хранятся 30 дней и это хранение нельзя отключить."] }'],
            ['"Prompts, selected attachments, and required context are sent to the selected model provider to perform the requested feature. Do not send passwords, keys, payment data, or third-party secrets without a lawful basis."', '"Prompts, selected attachments, and required context are sent to the selected model provider to perform the requested feature. For eligible factual/current/research requests, the minimized current turn may be sent to Google Grounding with Google Search to execute search and produce a grounded answer. Do not send passwords, keys, payment data, or third-party secrets without a lawful basis."'],
            ['"Legal acceptance evidence may be retained longer for proof of consent and dispute handling. External model-provider retention is controlled by the provider policy and contractual configuration."', '"Legal acceptance evidence may be retained longer for proof of consent and dispute handling. For Grounding with Google Search, Google states that prompts, contextual information, and generated output are stored for 30 days to create grounded results and Search Suggestions, and this storage cannot be disabled for that feature. Other external-provider retention is controlled by the applicable provider policy and contractual configuration."'],
            ['{ title: "Google / Auth.js", paragraphs: ["Google OAuth is a supported identity provider. Auth.js manages the TK LAB application session."] }', '{ title: "Google / Auth.js / Search grounding", paragraphs: ["Google OAuth is a supported identity provider and Auth.js manages the TK LAB application session. For eligible factual/current/research requests, Gemini API Grounding with Google Search may receive the minimized current turn, execute Google Search, and return a grounded answer, citations, and Search Suggestions. Under Google’s current terms for this grounding feature, that grounding data is stored for 30 days and the storage cannot be disabled."] }'],
          ];
          for (const [from, to] of replacements) {
            if (!legal.includes(from)) throw new Error(`Required legal text not found: ${from.slice(0, 80)}`);
            legal = legal.replace(from, to);
          }
          legal = legal.replace(/CURRENT_LEGAL_BUNDLE_DIGEST\s*=\s*"[a-f0-9]{64}"/, 'CURRENT_LEGAL_BUNDLE_DIGEST = "<CONTENT_DIGEST>"');
          const terms = fs.readFileSync('lib/terms.ts', 'utf8');
          const policy = fs.readFileSync('lib/policy-registry.ts', 'utf8');
          const digest = crypto.createHash('sha256').update([terms, legal, policy].join('\n---TKLAB-LEGAL-BUNDLE---\n')).digest('hex');
          legal = legal.replace('CURRENT_LEGAL_BUNDLE_DIGEST = "<CONTENT_DIGEST>"', `CURRENT_LEGAL_BUNDLE_DIGEST = "${digest}"`);
          fs.writeFileSync(path, legal);
          NODE
      - name: Verify legal consistency
        run: npm run legal:check
      - name: Commit disclosure and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/internal-v0242-legal-grounding.yml
          git add lib/legal-documents.ts
          git commit -m "docs(legal): disclose Google grounding retention"
          git push origin HEAD:agent/v0.24.2-google-direct-grounding
