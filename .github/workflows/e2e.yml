name: Browser Assurance

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - "agent/**"
  workflow_dispatch:

concurrency:
  group: browser-assurance-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.61.1
      - name: Install browser runtimes
        run: npx playwright install --with-deps chromium webkit
      - name: Run browser assurance
        run: npx playwright test
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: browser-assurance-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 5
