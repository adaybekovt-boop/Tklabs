name: Internal search config check

on:
  push:
    branches:
      - agent/v0.24.1-grounding-reliability
    paths:
      - .github/workflows/internal-search-config-check.yml

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GOOGLE_GEMINI_API_KEY: ${{ secrets.GOOGLE_GEMINI_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_API_KEY: ${{ secrets.GOOGLE_SEARCH_API_KEY }}
      GOOGLE_SEARCH_CX: ${{ secrets.GOOGLE_SEARCH_CX }}
    steps:
      - name: Report provider configuration presence only
        shell: bash
        run: |
          set -euo pipefail
          present() {
            local name="$1"
            if [ -n "${!name:-}" ]; then
              echo "$name=present"
            else
              echo "$name=missing"
            fi
          }
          present GOOGLE_GEMINI_API_KEY
          present GEMINI_API_KEY
          present BRAVE_SEARCH_API_KEY
          present GOOGLE_SEARCH_API_KEY
          present GOOGLE_SEARCH_CX
