name: Sync Release Lockfile

on:
  push:
    branches:
      - "agent/v0.17.0-reliability-foundation"
    paths:
      - ".github/workflows/sync-release-lock.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: agent/v0.17.0-reliability-foundation
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Synchronize npm release metadata
        run: npm version 0.17.5 --no-git-tag-version --allow-same-version
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "v0.17.5: synchronize npm lockfile"
          git push origin HEAD:agent/v0.17.0-reliability-foundation
