name: Finalize v0.21 IPv6 web guard

on:
  push:
    branches:
      - agent/v0.21-erma-intelligence-engine
    paths:
      - .github/workflows/finalize-v021-ipv6-guard.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v0.21-erma-intelligence-engine
      - name: Normalize bracketed IPv6 hostnames before private-host checks
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/ai/web/gateway.ts')
          s = p.read_text()
          old = 'const lowered = hostname.toLowerCase();'
          new = 'const lowered = hostname.toLowerCase().replace(/^\\[/, "").replace(/\\]$/, "");'
          if new not in s:
              if old not in s:
                  raise SystemExit('private host normalization line not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow and commit
        run: |
          git rm .github/workflows/finalize-v021-ipv6-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/ai/web/gateway.ts
          git commit -m "v0.21.1: normalize IPv6 web targets before guard checks"
          git push origin HEAD:agent/v0.21-erma-intelligence-engine
