<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TK Lab workspace</title>
  <desc id="desc">A quiet monochrome laboratory with illuminated server panels and a central TK mark.</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="0.6" stop-color="#5e6672"/>
      <stop offset="1" stop-color="#d8dce1"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090b0e"/>
      <stop offset="0.55" stop-color="#3d4653"/>
      <stop offset="1" stop-color="#b6bec9"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#eef5ff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#eef5ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="45"/></filter>
    <pattern id="grain" width="44" height="44" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="8" r="1" fill="#fff" opacity=".05"/>
      <circle cx="31" cy="23" r=".8" fill="#000" opacity=".08"/>
      <circle cx="17" cy="38" r=".7" fill="#fff" opacity=".04"/>
    </pattern>
  </defs>
  <rect width="1600" height="1000" fill="url(#wall)"/>
  <ellipse cx="800" cy="110" rx="390" ry="260" fill="url(#glow)" filter="url(#blur)" opacity=".6"/>
  <g opacity=".9">
    <g id="panel">
      <rect width="122" height="525" rx="14" fill="#171b21" stroke="#eaf0f8" stroke-opacity=".13"/>
      <rect x="24" y="40" width="74" height="424" rx="10" fill="#718094" opacity=".2"/>
      <g fill="#e5efff" opacity=".72">
        <circle cx="60" cy="84" r="4"/><circle cx="60" cy="134" r="4"/><circle cx="60" cy="184" r="4"/>
        <circle cx="60" cy="234" r="4"/><circle cx="60" cy="284" r="4"/><circle cx="60" cy="334" r="4"/>
        <circle cx="60" cy="384" r="4"/><circle cx="60" cy="434" r="4"/>
      </g>
    </g>
    <use href="#panel" x="28" y="90"/><use href="#panel" x="205" y="90"/><use href="#panel" x="382" y="90"/>
    <use href="#panel" x="1068" y="90"/><use href="#panel" x="1245" y="90"/><use href="#panel" x="1422" y="90"/>
  </g>
  <rect x="585" y="125" width="430" height="470" rx="42" fill="url(#rack)" stroke="#f5f8ff" stroke-opacity=".46" stroke-width="3"/>
  <g fill="#b4c1d2" fill-opacity=".24" stroke="#eef5ff" stroke-opacity=".16">
    <rect x="650" y="180" width="300" height="28" rx="10"/><rect x="650" y="236" width="300" height="28" rx="10"/>
    <rect x="650" y="292" width="300" height="28" rx="10"/><rect x="650" y="348" width="300" height="28" rx="10"/>
    <rect x="650" y="404" width="300" height="28" rx="10"/><rect x="650" y="460" width="300" height="28" rx="10"/>
  </g>
  <g fill="#f4f8ff"><circle cx="922" cy="194" r="5"/><circle cx="922" cy="250" r="5"/><circle cx="922" cy="306" r="5"/><circle cx="922" cy="362" r="5"/><circle cx="922" cy="418" r="5"/><circle cx="922" cy="474" r="5"/></g>
  <rect x="686" y="518" width="228" height="4" rx="2" fill="#edf3fb" opacity=".56"/>
  <g fill="none" stroke="#f7f9fc" stroke-width="13" stroke-linecap="square" stroke-linejoin="miter" opacity=".9">
    <path d="M704 535h76m-38 0v54"/><path d="M824 535v54m0-27 58-27m-58 27 60 30"/>
  </g>
  <path d="M0 610H1600V1000H0Z" fill="#e4e7eb" fill-opacity=".58"/>
  <g stroke="#343a43" stroke-opacity=".14" fill="none">
    <path d="M800 610 75 1000M800 610 310 1000M800 610 545 1000M800 610 1055 1000M800 610 1290 1000M800 610 1525 1000"/>
    <path d="M0 690H1600M0 780H1600M0 885H1600"/>
  </g>
  <rect width="1600" height="1000" fill="url(#grain)"/>
</svg>
