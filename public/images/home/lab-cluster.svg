<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">TK Lab server cluster</title>
  <desc id="desc">Three quiet monochrome compute racks connected in a bright laboratory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#202329"/>
      <stop offset=".62" stop-color="#7f8792"/>
      <stop offset="1" stop-color="#e4e6e9"/>
    </linearGradient>
    <linearGradient id="rack" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#111419"/>
      <stop offset=".55" stop-color="#414956"/>
      <stop offset="1" stop-color="#aeb6c1"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#eff5ff" stop-opacity=".62"/><stop offset="1" stop-color="#eff5ff" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="55"/></filter>
    <pattern id="grain" width="38" height="38" patternUnits="userSpaceOnUse"><circle cx="7" cy="9" r=".8" fill="#fff" opacity=".05"/><circle cx="29" cy="26" r=".7" fill="#000" opacity=".07"/></pattern>
  </defs>
  <rect width="1400" height="900" fill="url(#bg)"/>
  <ellipse cx="700" cy="270" rx="420" ry="300" fill="url(#halo)" filter="url(#soft)"/>
  <g fill="#161a20" opacity=".42">
    <rect x="0" width="82" height="565"/><rect x="142" width="82" height="565"/><rect x="284" width="82" height="565"/>
    <rect x="1034" width="82" height="565"/><rect x="1176" width="82" height="565"/><rect x="1318" width="82" height="565"/>
  </g>
  <path d="M0 560H1400V900H0Z" fill="#e7e9ec" fill-opacity=".7"/>
  <g stroke="#4b525d" stroke-opacity=".15" fill="none"><path d="M700 560 90 900M700 560 380 900M700 560 1020 900M700 560 1310 900"/><path d="M0 650H1400M0 760H1400"/></g>
  <g id="rack-one">
    <rect x="210" y="170" width="260" height="410" rx="27" fill="url(#rack)" stroke="#f3f6fb" stroke-opacity=".35" stroke-width="3"/>
    <g fill="#aebaca" fill-opacity=".2" stroke="#eef4fc" stroke-opacity=".12"><rect x="242" y="220" width="196" height="30" rx="9"/><rect x="242" y="274" width="196" height="30" rx="9"/><rect x="242" y="328" width="196" height="30" rx="9"/><rect x="242" y="382" width="196" height="30" rx="9"/><rect x="242" y="436" width="196" height="30" rx="9"/><rect x="242" y="490" width="196" height="30" rx="9"/></g>
    <g fill="#f1f7ff"><circle cx="411" cy="235" r="5"/><circle cx="411" cy="289" r="5"/><circle cx="411" cy="343" r="5"/><circle cx="411" cy="397" r="5"/><circle cx="411" cy="451" r="5"/><circle cx="411" cy="505" r="5"/></g>
  </g>
  <g transform="translate(335 -75) scale(1.12)"><use href="#rack-one"/></g>
  <g transform="translate(690 28) scale(.96)"><use href="#rack-one"/></g>
  <path d="M470 535C535 650 555 650 610 535M846 535C900 646 930 646 985 535" fill="none" stroke="#4b5461" stroke-width="9" stroke-linecap="round" opacity=".42"/>
  <g fill="none" stroke="#f7f9fc" stroke-width="11" opacity=".68"><path d="M630 516h66m-33 0v48"/><path d="M728 516v48m0-24 49-24m-49 24 51 25"/></g>
  <rect width="1400" height="900" fill="url(#grain)"/>
</svg>
